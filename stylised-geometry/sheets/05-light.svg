<text x="40" y="52" fill="#e8e8f0" font-size="28" font-weight="800">5 · Light and darkness</text>
<text x="40" y="80" fill="#9a9ab0" font-size="15">The world sits in the dark; a soft pool of light follows the hero. Characters and effects are never darkened.</text>
<rect x="40" y="110" width="860" height="480" rx="14" fill="#08080c"/>
