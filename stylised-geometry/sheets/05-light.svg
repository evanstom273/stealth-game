<text x="470" y="140" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="middle">The room falls into darkness at the edges of the screen</text>
<text x="780" y="560" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="middle">Enemies stay fully bright in the dark</text>
<text x="190" y="440" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="middle">Local lights: additive glows</text>
<rect x="920" y="110" width="440" height="480" rx="14" fill="#1d1d29"/>
<text x="940" y="145" fill="#e8e8f0" font-size="16" font-weight="600" text-anchor="start">How it works</text>
<text x="940" y="175" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">A radial gradient over the room: clear in the middle,</text>
<text x="940" y="197" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">falling to ~90% black near the screen edge.</text>
<text x="940" y="219" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">It follows the hero and scales with the camera zoom</text>
<text x="940" y="241" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">(sized from the screen diagonal, not world units).</text>
<text x="940" y="263" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start"></text>
<text x="940" y="285" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">Layer order, back to front:</text>
<text x="940" y="307" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">  room background, platforms, decoration</text>
<text x="940" y="329" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">  drifting motes (they only show near the light)</text>
<text x="940" y="351" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">  THE DARKNESS</text>
<text x="940" y="373" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">  effects, shots, enemies, the hero</text>
<text x="940" y="395" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start"></text>
<text x="940" y="417" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">Glows (candles, charge-ups, beams) use additive</text>
<text x="940" y="439" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">blending, built from several faint layers rather</text>
<text x="940" y="461" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">than one bright disc.</text>
<text x="940" y="483" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start"></text>
<text x="940" y="505" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">Light can be a resource: shrink the pool, snuff</text>
<text x="940" y="527" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">local lights, give light back as a reward.</text>
</svg>