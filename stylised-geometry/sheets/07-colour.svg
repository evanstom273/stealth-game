<text x="40" y="532" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="start">a light tint, 3 px on tops</text>
<text x="40" y="568" fill="#e8e8f0" font-size="14" font-weight="600" text-anchor="start">Accent 1</text>
<text x="40" y="584" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="start">the world's signature colour</text>
