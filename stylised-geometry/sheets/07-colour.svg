<text x="40" y="52" fill="#e8e8f0" font-size="28" font-weight="800">7 · Colour</text>
<text x="40" y="80" fill="#9a9ab0" font-size="15">Colour has jobs. Give each job one colour family and never let another thing borrow it.</text>
