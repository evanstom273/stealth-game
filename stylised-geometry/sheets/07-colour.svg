<text x="40" y="636" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="start">its opposite or partner</text>
<text x="40" y="672" fill="#e8e8f0" font-size="14" font-weight="600" text-anchor="start">Danger</text>
<text x="40" y="688" fill="#9a9ab0" font-size="12" font-weight="400" text-anchor="start">its own red or hot colour</text>
<text x="410" y="322" fill="#e8e8f0" font-size="15" font-weight="600" text-anchor="middle">Gothic</text>
