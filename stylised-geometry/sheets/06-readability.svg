<text x="60" y="632" fill="#e8e8f0" font-size="16" font-weight="600" text-anchor="start">Checklist for any new character</text>
<text x="60" y="660" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ Recognisable as a shape, in silhouette, at true size, in the dark?</text>
<text x="710" y="660" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ Has eyes, and the eyes do something?</text>
<text x="60" y="684" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ Not in the hero's colours, or damage red (unless that is the point)?</text>
<text x="710" y="684" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ Its attack has a tell: heat, pose, sound, a marker?</text>
<text x="60" y="708" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ Its vulnerable state reads at a glance?</text>
<text x="710" y="708" fill="#9a9ab0" font-size="13" font-weight="400" text-anchor="start">☐ It dies in pieces of its own shape?</text>
